name = "toontown-browser-asset-gateway"
main = "src/index.mjs"
compatibility_date = "2026-07-22"
workers_dev = false

routes = [
  { pattern = "toontown.lui.ss/assets/*", zone_name = "lui.ss" }
]

[[r2_buckets]]
binding = "ASSETS"
bucket_name = "toontown-browser-assets"

[[durable_objects.bindings]]
name = "ASSET_BUDGETS"
class_name = "AssetBudget"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AssetBudget"]

[vars]
PUBLIC_ORIGIN = "https://toontown.lui.ss"
